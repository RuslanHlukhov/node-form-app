name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  terraform-security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true


  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем исходный код проекта в среду выполнения
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Авторизуемся в Docker Hub используя секреты из настроек репозитория
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Собираем и пушим образ в ваш публичный репозиторий Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ruslanhlukhov/node-form-app:latest